<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TimeKeep - Lägg till Jira Ticket</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                width: 380px;
                min-height: 280px;
                font-family:
                    -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto',
                    'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
            }

            .container {
                padding: 20px;
            }

            .header {
                text-align: center;
                margin-bottom: 20px;
            }

            .header h1 {
                font-size: 20px;
                margin-bottom: 4px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
            }

            .header .subtitle {
                font-size: 12px;
                opacity: 0.9;
            }

            .ticket-preview {
                background: rgba(255, 255, 255, 0.15);
                backdrop-filter: blur(10px);
                padding: 16px;
                border-radius: 12px;
                margin-bottom: 16px;
                border: 1px solid rgba(255, 255, 255, 0.2);
            }

            .ticket-key {
                font-weight: 700;
                font-size: 16px;
                margin-bottom: 8px;
                color: #fbbf24;
            }

            .ticket-summary {
                font-size: 13px;
                line-height: 1.4;
                margin-bottom: 8px;
            }

            .ticket-meta {
                font-size: 11px;
                opacity: 0.8;
                display: flex;
                gap: 12px;
                flex-wrap: wrap;
            }

            .ticket-meta span {
                display: flex;
                align-items: center;
                gap: 4px;
            }

            .buttons {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            button {
                width: 100%;
                padding: 12px 16px;
                border: none;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
            }

            button:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

            .btn-add {
                background: #10b981;
                color: white;
            }

            .btn-add:hover:not(:disabled) {
                background: #059669;
                transform: translateY(-1px);
                box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
            }

            .btn-add-start {
                background: #3b82f6;
                color: white;
            }

            .btn-add-start:hover:not(:disabled) {
                background: #2563eb;
                transform: translateY(-1px);
                box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            }

            .btn-settings {
                background: rgba(255, 255, 255, 0.2);
                color: white;
                font-size: 12px;
                padding: 8px;
            }

            .btn-settings:hover:not(:disabled) {
                background: rgba(255, 255, 255, 0.3);
            }

            .status {
                text-align: center;
                font-size: 13px;
                margin-top: 12px;
                padding: 8px;
                border-radius: 6px;
                display: none;
            }

            .status.show {
                display: block;
            }

            .status.error {
                background: rgba(239, 68, 68, 0.2);
                border: 1px solid rgba(239, 68, 68, 0.4);
                color: #fca5a5;
            }

            .status.success {
                background: rgba(16, 185, 129, 0.2);
                border: 1px solid rgba(16, 185, 129, 0.4);
                color: #86efac;
            }

            .loading-screen {
                display: none;
                text-align: center;
                padding: 40px 20px;
            }

            .loading-screen.show {
                display: block;
            }

            .spinner {
                border: 4px solid rgba(255, 255, 255, 0.3);
                border-top: 4px solid white;
                border-radius: 50%;
                width: 40px;
                height: 40px;
                animation: spin 1s linear infinite;
                margin: 0 auto 16px;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }

            .settings-screen {
                display: none;
            }

            .settings-screen.show {
                display: block;
            }

            .form-group {
                margin-bottom: 16px;
            }

            .form-group label {
                display: block;
                font-size: 13px;
                margin-bottom: 6px;
                font-weight: 600;
            }

            .form-group input {
                width: 100%;
                padding: 10px;
                border: 1px solid rgba(255, 255, 255, 0.3);
                border-radius: 6px;
                background: rgba(255, 255, 255, 0.1);
                color: white;
                font-size: 14px;
            }

            .form-group input::placeholder {
                color: rgba(255, 255, 255, 0.6);
            }

            .form-group input:focus {
                outline: none;
                border-color: rgba(255, 255, 255, 0.6);
                background: rgba(255, 255, 255, 0.15);
            }

            .help-text {
                font-size: 11px;
                opacity: 0.8;
                margin-top: 4px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <!-- Main Screen -->
            <div id="main-screen">
                <div class="header">
                    <h1>
                        <span>🎫</span>
                        <span>TimeKeep</span>
                    </h1>
                    <div class="subtitle">Lägg till Jira-ticket</div>
                </div>

                <div class="ticket-preview">
                    <div class="ticket-key" id="ticket-key">Laddar...</div>
                    <div class="ticket-summary" id="ticket-summary">
                        Väntar på ticket-data...
                    </div>
                    <div class="ticket-meta" id="ticket-meta">
                        <span>📁 <span id="ticket-project">-</span></span>
                        <span>🏷️ <span id="ticket-type">-</span></span>
                    </div>
                </div>

                <div class="buttons">
                    <button class="btn-add" id="add-btn" disabled>
                        <span>➕</span>
                        <span>Lägg till uppdrag</span>
                    </button>

                    <button class="btn-add-start" id="add-start-btn" disabled>
                        <span>▶️</span>
                        <span>Lägg till & starta timer</span>
                    </button>

                    <button class="btn-settings" id="settings-btn">
                        <span>⚙️</span>
                        <span>Inställningar</span>
                    </button>
                </div>

                <div class="status" id="status"></div>
            </div>

            <!-- Loading Screen -->
            <div class="loading-screen" id="loading-screen">
                <div class="spinner"></div>
                <div>Lägger till ticket...</div>
            </div>

            <!-- Settings Screen -->
            <div class="settings-screen" id="settings-screen">
                <div class="header">
                    <h1>⚙️ Inställningar</h1>
                </div>

                <div class="form-group">
                    <label for="user-id-input">Firebase User ID:</label>
                    <input
                        type="text"
                        id="user-id-input"
                        placeholder="Din User ID från TimeKeep"
                    />
                    <div class="help-text">
                        Hittar du i TimeKeep när du är inloggad
                    </div>
                </div>

                <div class="form-group">
                    <label for="api-url-input">TimeKeep API URL:</label>
                    <input
                        type="text"
                        id="api-url-input"
                        placeholder="http://localhost:3000"
                        value="http://localhost:3000"
                    />
                    <div class="help-text">
                        Byt till produktions-URL när den finns
                    </div>
                </div>

                <div class="buttons">
                    <button class="btn-add" id="save-settings-btn">
                        <span>💾</span>
                        <span>Spara inställningar</span>
                    </button>
                    <button class="btn-settings" id="back-btn">
                        <span>←</span>
                        <span>Tillbaka</span>
                    </button>
                </div>

                <div class="status" id="settings-status"></div>
            </div>
        </div>

        <script src="popup.js"></script>
    </body>
</html>
