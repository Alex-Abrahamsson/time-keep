<svg width="128" height="128" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient bakgrund -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rundad bakgrund -->
  <rect width="128" height="128" rx="24" fill="url(#grad)"/>
  
  <!-- Timer symbol (klocka) -->
  <circle cx="64" cy="64" r="35" fill="white" opacity="0.9"/>
  <circle cx="64" cy="64" r="32" fill="none" stroke="#667eea" stroke-width="3"/>
  
  <!-- Visare -->
  <line x1="64" y1="64" x2="64" y2="45" stroke="#667eea" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="78" y2="64" stroke="#764ba2" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Center punkt -->
  <circle cx="64" cy="64" r="4" fill="#667eea"/>
  
  <!-- Play/Start symbol i hörnet -->
  <circle cx="96" cy="96" r="16" fill="#10b981"/>
  <path d="M 91 88 L 91 104 L 103 96 Z" fill="white"/>
</svg>
